server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

spring:
  jpa:
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migrations/common,classpath:/db/migrations/test

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
